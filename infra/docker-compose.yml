services:
   mongo:
      image: mongo:8.0.4
      container_name: uptask-mongo
      ports:
         - "${MONGO_PORT}:27017"
      volumes:
         - mongo-data:/data/db

   server:
      build: ../server
      container_name: uptask-server
      env_file:
         - ../server/.env
      ports:
         - "${SERVER_PORT}:${SERVER_PORT}"
      volumes:
         - ../server:/app
         - /app/node_modules
      depends_on:
         - mongo

   client:
      build: ../client
      container_name: uptask-client
      ports:
         - "${CLIENT_PORT}:5173"
      volumes:
         - ../client:/app
         - /app/node_modules
      depends_on:
         - server

volumes:
   mongo-data:
